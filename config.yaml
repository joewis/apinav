# Central configuration for apinav.
# Paths here are absolute because this runs on a specific home-lab host.

paths:
  apinav_dir: /home/carl/apinav
  env_file: /home/carl/apinav/.env
  db: /home/carl/apinav/catalog.db

embeddings:
  url: https://integrate.api.nvidia.com/v1/embeddings
  model: nvidia/nemotron-3-embed-1b
  batch_size: 32
  base_delay: 0.5
  max_retries: 5
  retry_backoff: 2.0
  max_desc_chars: 4000

rerank:
  # Backend selection: "typesafe" (Jev System One: one Noul relevance judgment
  # per candidate, batch of 8, parallel HTTP) or "nvidia" (Cohere-shape rerank
  # endpoint). typesafe is default: 10-query A/B (2026-09-18) showed equal or
  # better top-3 on 9/10, near-duplicate suppression, ~1.5s slower per search.
  backend: typesafe
  url: https://openrouter.ai/api/v1/rerank
  model: nvidia/llama-nemotron-rerank-vl-1b-v2:free
  top_n: 100
  threshold: 0.02
  # TypeSafe (Jev) reranker settings. noul_threshold filters candidates below
  # the yes-probability; batch_size = candidates per systemone call. CAUTION:
  # large batches (25) exhibit context bleed — a candidate judged next to
  # highly-relevant batch-mates can inherit their relevance (measured: an
  # irrelevant access-control API scored 0.92 for a gold-prices query at
  # batch 25, 0.02 at batch 8). 8 is the tested-safe value; raising it needs
  # re-validation against a mixed-relevance pool.
  typesafe_url: https://api.typesafe.ai/v1/systemone
  typesafe_model: jev-latest
  noul_threshold: 0.3
  batch_size: 8
  # Scoring shape. "choice" ranks the whole pool with one Choice question per chunk
  # (choice_chunk candidates each, choice_width characters of description per option),
  # keeps choice_shortlist per chunk, then confirms the union with absolute Nouls in ONE
  # request. "noul" is the older per-candidate batched scorer governed by batch_size.
  # Measured on 4 real 115-121-row pools (2026-09): top-10 agreement with the nvidia
  # cross-encoder 32/40 for BOTH shapes, at 12 requests per search for choice vs 62 for
  # noul, for the same wall clock. The request gap widens with pool size (noul needs one
  # request per batch_size candidates; choice needs one per choice_chunk). Flip to "noul"
  # to fall back to the proven scorer.
  typesafe_strategy: choice
  choice_chunk: 80
  choice_width: 600
  choice_shortlist: 24

search:
  fts_prepass_n: 30

ingest:
  per_source_cap: 5
  busy_timeout_ms: 3000

http:
  pacing: 0.5
  timeout: 30
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) Elitedesk-API-Search"
